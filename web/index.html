<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kimba Café | Panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div><span class="mark">K</span><span><b>KIMBA CAFÉ</b><small>Panel de administración</small></span></div>
    <div id="connection" class="live">● En vivo</div>
  </header>
  <main>
    <section class="hero">
      <div><p class="eyebrow">RESUMEN OPERATIVO</p><h1>Ventas y pedidos</h1><p id="updated">Actualizando datos...</p></div>
      <button class="button primary" id="refresh">↻ Actualizar ahora</button>
    </section>
    <section class="cards" id="metrics"></section>
    <section class="panel">
      <div class="section-title"><div><p class="eyebrow">PEDIDOS</p><h2>Registro reciente</h2></div><span class="badge" id="order-count"></span></div>
      <div class="table-wrap"><table><thead><tr><th>Hora</th><th>Productos</th><th>Estado</th><th>Total</th></tr></thead><tbody id="orders"></tbody></table></div>
    </section>
    <section class="panel">
      <div class="section-title"><div><p class="eyebrow">MENÚ</p><h2>Administrar productos</h2></div><button class="button primary" id="add-product">+ Agregar producto</button></div>
      <div class="product-grid" id="products"></div>
    </section>
  </main>
  <dialog id="editor"><form method="dialog" id="product-form"><div class="dialog-head"><h2 id="form-title">Agregar producto</h2><button class="icon" value="cancel">×</button></div><input id="product-id" type="hidden"><label>Nombre<input id="name" required maxlength="100" placeholder="Ej. Mocaccino"></label><label>Precio en Bs<input id="price" required type="number" min="0.01" step="0.01" placeholder="0.00"></label><label>Categoría<select id="category"><option>Bebidas calientes</option><option>Bebidas frías</option><option>Sándwiches</option></select></label><p class="form-error" id="form-error"></p><div class="dialog-actions"><button class="button" value="cancel">Cancelar</button><button class="button primary" id="save" value="default">Guardar cambios</button></div></form></dialog>
  <script src="app.js"></script>
</body>
</html>
